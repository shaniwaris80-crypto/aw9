<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FACTUMADRID AW9</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-logo">AW9</div>
      <h1>FACTUMADRID</h1>
      <p class="muted">Gestión profesional · Firebase Cloud</p>
      <label>Email
        <input id="loginEmail" type="email" value="shaniwaris80@gmail.com" autocomplete="username" required />
      </label>
      <label>Contraseña
        <div class="password-row"><input id="loginPassword" type="password" autocomplete="current-password" required /><button type="button" id="showPassword" class="icon-btn">👁</button></div>
      </label>
      <label class="check-row"><input id="rememberSession" type="checkbox" checked /> Recordar sesión en este dispositivo</label>
      <button class="btn primary full" type="submit">ENTRAR</button>
      <button class="btn subtle full" type="button" id="changeAccountBtn">Cambiar cuenta</button>
      <p id="loginStatus" class="tiny muted"></p>
    </form>
  </div>

  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><div class="brand-mark">AW9</div><div><strong>FACTUMADRID</strong><small>Gestión profesional</small></div></div>
      <nav id="mainNav"></nav>
      <div class="side-bottom">
        <div id="userBadge" class="user-badge"></div>
        <button id="logoutBtn" class="btn subtle full">Cerrar sesión</button>
      </div>
    </aside>
    <div id="scrim" class="scrim hidden"></div>
    <main class="main">
      <header class="topbar">
        <div class="top-left"><button id="menuBtn" class="icon-btn">☰</button><div><h2 id="pageTitle">Inicio</h2><small id="pageSub" class="muted">Panel general</small></div></div>
        <div class="top-actions"><button id="globalSearchBtn" class="icon-btn" title="Buscar">⌕</button><span id="cloudStatus" class="pill">Cloud</span></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <input id="importBackupInput" type="file" accept="application/json" hidden />

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/iva-ui.js"></script>
  <script type="module" src="js/box-billing.js"></script>
  <script type="module" src="js/invoice-uppercase.js"></script>
  <script type="module" src="js/invoice-professional.js"></script>
</body>
</html>
