<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ARW2026 · Gestión integral</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login-card">
    <div class="login-logo">ARW</div>
    <h1>ARW2026</h1>
    <p>SISTEMA INTEGRAL DE GESTIÓN Y FACTURACIÓN</p>
    <label>EMAIL<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label>CONTRASEÑA<div class="password-row"><input id="loginPassword" type="password" autocomplete="current-password"><button type="button" id="showPassword" class="icon-btn">👁</button></div></label>
    <label class="check"><input id="rememberSession" type="checkbox" checked> RECORDAR SESIÓN</label>
    <button class="btn primary full" type="submit">ENTRAR CON EMAIL</button>
    <button class="btn full" type="button" id="googleLoginBtn">ENTRAR CON GOOGLE</button>
    <small id="loginStatus"></small>
  </form>
</div>
<div id="appShell" class="app-shell hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="brand-mark">ARW</div><div><b>ARW2026</b><small>GESTIÓN PROFESIONAL</small></div></div>
    <nav id="mainNav"></nav>
    <div class="side-bottom"><div id="userBadge" class="user-badge"></div><button id="logoutBtn" class="btn subtle full">CERRAR SESIÓN</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><button id="menuBtn" class="icon-btn">☰</button><span id="pageTitle">INICIO</span></div><div class="top-actions"><button id="quickAddBtn" class="btn primary">＋ NUEVO</button><button id="globalSearchBtn" class="icon-btn">⌕</button><span id="cloudStatus" class="pill">CLOUD</span></div></header>
    <section id="view" class="view"></section>
  </main>
</div>
<nav id="mobileNav" class="mobile-nav hidden"></nav>
<div id="modalRoot"></div><div id="toastRoot" class="toast-root"></div>
<input id="importFile" type="file" accept=".json,.xlsx,.xls,.csv" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
