<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>AW9 · Facturación</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginView" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">AW9</div>
      <h1>FACTUMADRID</h1>
      <p class="muted">Facturación · clientes · stock · reportes</p>
      <form id="loginForm" class="stack">
        <label>Email
          <div class="input-inline">
            <input id="loginEmail" type="email" autocomplete="username" value="shaniwaris80@gmail.com" readonly>
            <button id="changeAccountBtn" class="text-btn" type="button">Cambiar</button>
          </div>
        </label>
        <label>Contraseña
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Contraseña Firebase">
        </label>
        <label class="check-row"><input id="rememberSession" type="checkbox" checked> Recordar sesión en este dispositivo</label>
        <button class="primary big" type="submit">Entrar</button>
        <button id="localModeBtn" class="secondary" type="button">Entrar en modo local</button>
        <div id="loginMsg" class="notice" hidden></div>
      </form>
      <small class="muted">La contraseña nunca se guarda en el código.</small>
    </section>
  </div>

  <div id="appShell" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand-row">
        <div class="brand-mark small">AW9</div>
        <div><strong>FACTUMADRID</strong><small>Nueva generación</small></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div id="cloudBadge" class="pill">Local</div>
        <button id="logoutBtn" class="secondary full" type="button">Cerrar sesión</button>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>
    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" type="button">☰</button>
        <div><strong id="pageTitle">Inicio</strong><small id="pageSubtitle">Panel general</small></div>
        <div class="top-actions">
          <span id="saveStatus" class="save-status">Guardado</span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
