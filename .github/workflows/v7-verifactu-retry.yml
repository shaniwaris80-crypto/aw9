name: Integrar reintento horario VERI*FACTU
on:
  push:
    branches: [arw2026-pro-v7-work]
    paths: ['tools/v7_verifactu_retry.py','.github/workflows/v7-verifactu-retry.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arw2026-pro-v7-work}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 tools/v7_verifactu_retry.py
      - run: node --check functions/index.js
      - run: |
          git config user.name 'shaniwaris80-crypto'
          git config user.email 'shaniwaris80@gmail.com'
          git add functions
          git commit -m 'ARW2026 PRO v7: reintento horario VERI*FACTU' || exit 0
          git push origin HEAD:arw2026-pro-v7-work
