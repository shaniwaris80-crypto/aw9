name: Aplicar auditoria ARW2026 v6
on:
  push:
    paths:
      - 'tools/final_audit_v6.py'
      - '.github/workflows/audit-fix-v6.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalizar acciones del dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          e=Path('js/enhancements.js')
          s=e.read_text()
          corrected="""  const actions=[can(Runtime.role,'invoiceWrite')?'<button class=\"btn primary\" data-action=\"invoice-new\">＋ FACTURA</button>':'',can(Runtime.role,'orderWrite')?'<button class=\"btn\" data-action=\"paste-order\">PEGAR PEDIDO</button>':'',can(Runtime.role,'invoiceWrite')?'<button class=\"btn\" data-action=\"invoice-all-delivered\">⚡ FACTURAR TODA LA RUTA</button>':'',can(Runtime.role,'weekReset')?'<button class=\"btn\" data-action=\"week-reset\">↻ PONER CONTADORES A 0</button>':''].join('');
  return"""
          out,n=re.subn(r"  const actions=\[.*?\]\.join\(''\);\n  return",corrected,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'No se pudo normalizar dashboard: {n}')
          e.write_text(out)
          p=Path('tools/final_audit_v6.py')
          lines=p.read_text().splitlines()
          lines=[l for l in lines if not l.startswith("rep('js/enhancements.js',\"can(Runtime.role,'weekReset')?")]
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Aplicar cierre de auditoría
        run: python3 tools/final_audit_v6.py
      - name: Validar todo antes de publicar
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check firebase-config.js
          node --check service-worker.js
          node tests/domain.test.mjs
          node tests/finance.test.mjs
          node tests/audit.test.mjs
          python3 - <<'PY'
          import pathlib,re,sys
          bad=[]
          for p in pathlib.Path('js').rglob('*.js'):
              text=p.read_text()
              for x in re.findall(r"from\s+['\"](\.[^'\"]+)['\"]",text):
                  q=(p.parent/x).resolve()
                  if not q.exists(): bad.append((str(p),x))
          if bad:
              print(bad);sys.exit(1)
          print('Imports OK')
          PY
      - name: Commit cierre auditado
        run: |
          git config user.name 'shaniwaris80-crypto'
          git config user.email 'shaniwaris80@gmail.com'
          git add js manifest.webmanifest README.md
          git commit -m 'ARW2026 v6: cierre final de auditoria' || exit 0
          git push
