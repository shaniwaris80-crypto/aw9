name: Limpiar ramas temporales ARW2026
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-arw2026-branches.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eliminar ramas temporales
        run: |
          for b in arw2026v2-build arw2026v2-build2 arw2026v2-clean arw2026v2-finalbuild arw2026v2-safe-installer arw2026v2-stage arw2026v2-test arw2026v2-tree-test arw2026v2-work validate-arw2026-final; do
            git push origin --delete "$b" || true
          done
