name: Reparar ARW2026 puntual
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-arw2026.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corregir escritura puntual
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/app.js')
          s=p.read_text()
          s=s.replace("act===='product360'", "act==='product360'")
          p.write_text(s)
          PY
      - name: Validar antes de guardar
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          npx --yes esbuild@0.25.9 js/app.js --bundle --format=esm --outfile=/tmp/arw2026.js --external:https://* --log-level=warning
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --quiet || git commit -m "Corregir escritura puntual ARW2026 v2"
          git push origin HEAD:main
