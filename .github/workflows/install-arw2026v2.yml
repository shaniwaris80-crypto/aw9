name: Instalar ARW2026 v2 limpio

on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-arw2026v2.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruir paquete ARW2026 v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/2 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303589138 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303614358 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303595677 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303602580 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303618919 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303623183 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303627148 --jq .body >> /tmp/arw2026.b64
          gh api repos/${{ github.repository }}/issues/comments/5303631378 --jq .body >> /tmp/arw2026.b64
          tr -d '\n\r ' < /tmp/arw2026.b64 > /tmp/arw2026.clean.b64
          test "$(wc -c < /tmp/arw2026.clean.b64)" -eq 84388
          base64 -d /tmp/arw2026.clean.b64 > /tmp/arw2026.tar.gz
          echo '7be803e6b7562a68cc5a87b9c0c0f92017b5b4bf7e0602c8699b67c423aadef0  /tmp/arw2026.tar.gz' | sha256sum -c -
          rm -rf /tmp/arw2026-new
          mkdir -p /tmp/arw2026-new
          tar -xzf /tmp/arw2026.tar.gz -C /tmp/arw2026-new

      - name: Aplicar corrección validada de facturación desde pedido
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/arw2026-new/js/app.js')
          s=p.read_text(encoding='utf-8')
          old="import {calcInvoice,clientBalance,stockForProduct} from './core/domain.js';"
          new="import {calcInvoice,clientBalance,stockForProduct,lineFromProduct} from './core/domain.js';"
          assert old in s
          s=s.replace(old,new,1)
          old2="...(await import('./core/domain.js')).lineFromProduct(p,c)"
          assert old2 in s
          s=s.replace(old2,"...lineFromProduct(p,c)",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar versión nueva antes de publicar
        run: |
          cd /tmp/arw2026-new
          test -f index.html
          test -f firebase-config.js
          test -f firestore.rules
          test -f storage.rules
          test -f manifest.webmanifest
          test -f service-worker.js
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*'):
              if p.is_file():
                  p.read_text(encoding='utf-8') if p.suffix in {'.js','.html','.css','.md','.yml','.json','.webmanifest','.rules'} else None
          PY
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          npx --yes esbuild@0.25.9 js/app.js --bundle --format=esm --outfile=/tmp/arw2026-bundle.js --external:https://* --log-level=warning
          ! grep -R "Cannot access 'Store' before initialization" -n .
          ! find . -type f \( -name 'app-code-*' -o -name 'box-billing.js' -o -name 'invoice-uppercase.js' -o -name 'login-access.js' -o -name 'fix-arw2026.yml' -o -name 'install-arw2026v2.yml' \) | grep .

      - name: Sustituir main completamente
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/arw2026-new/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconstruir ARW2026 v2 completo, limpio y validado'
          git push origin HEAD:main
