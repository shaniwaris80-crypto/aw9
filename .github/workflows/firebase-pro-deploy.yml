name: Firebase PRO deploy
on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Desplegar también Functions VERI*FACTU'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['firestore.rules','storage.rules','firestore.indexes.json','firebase.json']
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AW999 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Comprobar credenciales
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo 'Falta secret FIREBASE_SERVICE_ACCOUNT_AW999'; exit 1; fi
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AW999 }}'
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm install -g firebase-tools
      - name: Desplegar reglas e índices
        run: firebase deploy --project aw999-71828 --only firestore:rules,firestore:indexes,storage
      - name: Desplegar Functions bajo confirmación
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_functions }}
        run: firebase deploy --project aw999-71828 --only functions
