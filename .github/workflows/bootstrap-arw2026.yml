name: Instalar ARW2026 v2
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - 'arw2026-source.part-*'
      - '.github/workflows/bootstrap-arw2026.yml'
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extraer versión validada
        shell: bash
        run: |
          set -euo pipefail
          cat arw2026-source.part-* | base64 -d > /tmp/arw2026.tar.gz
          mkdir -p /tmp/arw2026-new
          tar -xzf /tmp/arw2026.tar.gz -C /tmp/arw2026-new
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/arw2026-new/. .
      - name: Sustituir main por ARW2026 v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ARW2026 v2 · reconstrucción completa y limpia"
          git push origin HEAD:main
