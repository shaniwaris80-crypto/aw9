name: Validar ARW2026 PRO
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Sintaxis JS
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check firebase-config.js
          node --check service-worker.js
          node --check functions/index.js
      - name: Pruebas de dominio, finanzas, auditoría y VERI*FACTU
        run: |
          node tests/domain.test.mjs
          node tests/finance.test.mjs
          node tests/audit.test.mjs
          node tests/verifactu.test.mjs
      - name: Imports locales
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          bad=[]
          for p in pathlib.Path('js').rglob('*.js'):
              text=p.read_text()
              for x in re.findall(r"from\s+['\"](\.[^'\"]+)['\"]",text):
                  q=(p.parent/x).resolve()
                  if not q.exists(): bad.append((str(p),x))
          if bad: print(bad);sys.exit(1)
          print('Imports OK')
          PY
      - name: Auditoría de invariantes PRO
        run: |
          python3 - <<'PY'
          import pathlib,sys,re
          fb=pathlib.Path('js/firebase.js').read_text();dom=pathlib.Path('js/domain.js').read_text();app=pathlib.Path('js/app.js').read_text();fin=pathlib.Path('js/finance.js').read_text();ops=pathlib.Path('js/views-ops.js').read_text();rules=pathlib.Path('firestore.rules').read_text();vf=pathlib.Path('js/verifactu.js').read_text();sw=pathlib.Path('service-worker.js').read_text()
          checks={
            'emisión valida factura':'validateInvoice(invoice)' in fb,
            'serie no se reinicia':'if(!seriesSnap.exists())' in fb,
            'reset stock cloud por ubicación':'for(const p of products||[])for(const location of locations)' in fb,
            'reset detecta negativos por ubicación':'stockResetPlan' in fin,
            'fecha local':'export function localDate' in dom,
            'precio cero bloqueado':'PRECIO DEBE SER MAYOR QUE 0' in dom,
            'cierre bloquea emisión':'assertMonthOpenTx' in fb,
            'coste congelado en emisión':bool(re.search(r'buyPriceSnapshot:Number\(l\.buyPriceSnapshot\?\?(?:p|prod)\?\.buyPrice\?\?0\)',fb)),
            'centro financiero conectado':"'finance','💹','CENTRO FINANCIERO'" in app,
            'monitor conectado':"'monitor','🩺','MONITOR PRO'" in app,
            'verifactu conectado':"'verifactu','🧬','VERI*FACTU'" in app,
            'huella oficial SHA256':'IDEmisorFactura=' in vf and "crypto.subtle.digest('SHA-256'" in vf,
            'cadena fiscal en transacción':"ref('fiscalChain','state')" in fb,
            'fiscal records inmutables':'allow update, delete: if false;' in rules and 'fiscalRecords' in rules,
            'pagos inmutables':"match /companies/arw2026/payments/{id}" in rules,
            'movimientos stock inmutables':"match /companies/arw2026/stockMoves/{id}" in rules,
            'stock ops atómico':'saveStockOperation' in ops,
            'cierre usa stock a fecha':'function stockAt(' in ops,
            'PWA PRO':'views-pro.js' in sw and 'verifactu.js' in sw,
          }
          bad=[k for k,v in checks.items() if not v];print(checks)
          if bad: print('Faltan invariantes:',bad);sys.exit(1)
          PY
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install --no-audit --no-fund
      - name: Pruebas reales de reglas Firestore
        run: npm run test:rules
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Smoke test móvil/PWA
        run: npm run test:browser
