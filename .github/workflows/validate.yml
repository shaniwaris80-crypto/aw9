name: Validar ARW2026
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Sintaxis JS
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check firebase-config.js
          node --check service-worker.js
      - name: Pruebas de dominio
        run: node tests/domain.test.mjs
      - name: Pruebas financieras
        run: node tests/finance.test.mjs
      - name: Imports locales
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          bad=[]
          for p in pathlib.Path('js').rglob('*.js'):
              text=p.read_text()
              for x in re.findall(r"from\s+['\"](\.[^'\"]+)['\"]",text):
                  q=(p.parent/x).resolve()
                  if not q.exists(): bad.append((str(p),x))
          if bad:
              print(bad);sys.exit(1)
          print('Imports OK')
          PY
      - name: Auditoría de invariantes
        run: |
          python3 - <<'PY'
          import pathlib,sys
          fb=pathlib.Path('js/firebase.js').read_text()
          dom=pathlib.Path('js/domain.js').read_text()
          app=pathlib.Path('js/app.js').read_text()
          fin=pathlib.Path('js/finance.js').read_text()
          checks={
            'emisión valida factura':'validateInvoice(invoice)' in fb,
            'serie no se reinicia':'if(!seriesSnap.exists())' in fb,
            'reset stock cloud por ubicación':'for(const p of products||[])for(const location of locations)' in fb,
            'reset detecta negativos por ubicación':'stockResetPlan' in fin,
            'fecha local':'export function localDate' in dom,
            'precio cero bloqueado':'PRECIO DEBE SER MAYOR QUE 0' in dom,
            'cierre bloquea emisión':'assertMonthOpenTx' in fb,
            'coste congelado en líneas':'buyPriceSnapshot' in dom,
            'centro financiero conectado':"'finance','💹','CENTRO FINANCIERO'" in app,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad:
            print('Faltan invariantes:',bad);sys.exit(1)
          PY
