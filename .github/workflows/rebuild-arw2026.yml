name: Rebuild ARW2026
on:
  push:
    paths: ['.arw-deploy/READY']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild clean repository
        shell: bash
        run: |
          set -euo pipefail
          cat .arw-deploy/part* | base64 -d > /tmp/arw2026.tgz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/arw2026.tgz -C .
          rm -f .github/workflows/validate.yml
          git config user.name "ARW2026 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruir ARW2026 completo y corregido"
          git push origin HEAD:main
