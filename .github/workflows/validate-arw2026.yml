name: Validar ARW2026
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Resolver módulos y exports
        run: npx --yes esbuild@0.25.9 js/app.js --bundle --format=esm --outfile=/tmp/arw2026.js --external:https://* --log-level=warning
      - name: Archivos esenciales
        run: test -f index.html && test -f styles.css && test -f firebase-config.js && test -f firestore.rules && test -f storage.rules && test -f service-worker.js && test -f manifest.webmanifest
      - name: No quedan módulos AW9 antiguos
        run: '! find . -type f \( -name "app-code-*" -o -name "box-billing.js" -o -name "invoice-uppercase.js" \) | grep .'
