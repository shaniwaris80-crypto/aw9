name: Integrar estado backend fiscal V7
on:
  push:
    branches: [arw2026-pro-v7-work]
    paths: ['tools/v7_backend_status.py','.github/workflows/v7-backend-status.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: arw2026-pro-v7-work}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 tools/v7_backend_status.py
      - run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check functions/index.js
          node tests/verifactu.test.mjs
          node tests/audit.test.mjs
      - run: |
          git config user.name 'shaniwaris80-crypto'
          git config user.email 'shaniwaris80@gmail.com'
          git add js functions
          git commit -m 'ARW2026 PRO v7: estado backend fiscal seguro' || exit 0
          git push origin HEAD:arw2026-pro-v7-work
